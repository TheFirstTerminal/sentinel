{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # an upgrade must not log everyone out
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "sentinel.fullname" .) }}
  {{- if and $existing (index $existing.data "SENTINEL_SECRET") }}
  SENTINEL_SECRET: {{ index $existing.data "SENTINEL_SECRET" }}
  {{- else }}
  SENTINEL_SECRET: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
