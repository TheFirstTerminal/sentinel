# Runs when a version tag (v0.6.0, ...) is pushed: builds the Sentinel
# image and binaries, writes a Software Bill of Materials (SBOM), scans it
# for known vulnerabilities, and publishes everything.
#
# Signing: while the repository is private, nothing is signed, because
# keyless signing (Sigstore) records the repository name in a public
# transparency log. Once the repository is public, the image, its SBOM and
# the binary checksums are signed automatically. See docs/supply-chain.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the GitHub release
  packages: write    # push the image to GitHub Container Registry
  id-token: write    # keyless signing (only used when public)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLIC: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: false

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Known vulnerabilities in Go code and dependencies (govulncheck)
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Binaries and checksums
        working-directory: gateway
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -mod=vendor -trimpath \
              -ldflags="-s -w -X main.Version=$VERSION" -o "../dist/sentinel-$VERSION-$os-$arch$ext" ./cmd/sentinel
          done
          cp ../LICENSE.md ../NOTICE ../THIRD_PARTY_LICENSES.md ../dist/
          cd ../dist && sha256sum sentinel-* > checksums.txt

      - uses: docker/setup-qemu-action@v3   # build the arm64 image too
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          provenance: true

      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/sentinel-${{ env.VERSION }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan the SBOM for known vulnerabilities (fail on critical)
        uses: anchore/scan-action@v7
        with:
          sbom: dist/sentinel-${{ env.VERSION }}.sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - name: Sign (public repository only)
        if: env.PUBLIC == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image, attach the SBOM, sign the checksums
        if: env.PUBLIC == 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "dist/sentinel-$VERSION.sbom.spdx.json" "$REF"
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Image: `${{ env.IMAGE }}:${{ env.VERSION }}` (digest `${{ steps.build.outputs.digest }}`)
            What changed: see CHANGELOG.md. How to verify: docs/supply-chain.md.
